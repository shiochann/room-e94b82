<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP</title>
<!--
  リンクプレビュー用画像の元データ。
  QuickLookは正方形で書き出すので、1200×1200で作り、
  中央の630pxの帯だけを切り出して1200×630のOGP画像にする。
  （中央の帯からはみ出す位置に文字を置かないこと）

  再生成:  bash make-ogp.sh
  外部フォントは読み込めないので、システムのフォントだけで組んでいる。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; }
  body {
    background: #fbf4e4;
    color: #323232;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* 背景の飾り（サイト本体と同じ3色） */
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .38; }
  .mint { width: 520px; height: 520px; background: #7bd0ad; top: 180px;  right: -120px; }
  .pink { width: 460px; height: 460px; background: #eaa1ac; bottom: 180px; left: -140px; }
  .blue { width: 380px; height: 380px; background: #95abe5; bottom: 240px; right: 180px; }

  /* 切り出す中央の帯（1200×630） */
  .band {
    position: absolute; top: 285px; left: 0;
    width: 1200px; height: 630px;
    padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center;
  }

  .label {
    font-size: 20px; font-weight: 700; letter-spacing: .3em;
    color: #6f6a62; margin-bottom: 26px;
  }
  .title {
    font-size: 92px; font-weight: 800; letter-spacing: .01em;
    line-height: 1.18; margin-bottom: 30px;
  }
  .lead {
    font-size: 26px; line-height: 1.8; color: #4a4640; letter-spacing: .03em;
  }
  .foot {
    margin-top: 22px;
    display: flex; align-items: center; gap: 16px;
  }
  .mark {
    width: 46px; height: 46px; border-radius: 11px;
    background: #003953; position: relative; flex-shrink: 0;
  }
  .mark i { position: absolute; left: 9px; height: 8px; border-radius: 4px; background: #fff; }
  .mark i:nth-child(1) { top: 10px; width: 28px; }
  .mark i:nth-child(2) { top: 21px; width: 21px; }
  .mark i:nth-child(3) { top: 32px; width: 14px; background: #ec7a9b; }
  .brand { font-size: 19px; font-weight: 700; letter-spacing: .22em; color: #6f6a62; }
</style>
</head>
<body>
  <span class="blob mint"></span>
  <span class="blob pink"></span>
  <span class="blob blue"></span>

  <div class="band">
    <p class="label">CHROME EXTENSION</p>
    <h1 class="title">SNS投稿コレクター</h1>
    <p class="lead">
      Threadsの投稿をまとめて集めて、反応が良かったものだけを抜き出す。<br>
      ツリーは全文つなげて、AIに渡せる形にします。
    </p>
    <div class="foot">
      <span class="mark"><i></i><i></i><i></i></span>
      <span class="brand">DOWNLOAD &amp; GUIDE</span>
    </div>
  </div>
</body>
</html>
